<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی و ریاضی - کسرها</title>
    <!-- فونت وزیرمتن و آیکون‌های فونت‌آوسام -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #6C5CE7;
            --secondary: #FDCB6E;
            --success: #00B894;
            --danger: #FF7675;
            --bg-gradient: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
        }

        * {
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: #2D3436;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            overflow-x: hidden;
            position: relative;
        }

        /* --- تم شلوغ پس زمینه (المان های شناور ریاضی) --- */
        .bg-shapes {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .shape {
            position: absolute;
            font-weight: 900;
            color: rgba(108, 92, 231, 0.15);
            animation: floatShape linear infinite;
        }

        @keyframes floatShape {
            0% { transform: translateY(100vh) rotate(0deg); }
            100% { transform: translateY(-100px) rotate(360deg); }
        }

        /* --- استایل کسرها (خط کسری واقعی) --- */
        .fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
            margin: 0 8px;
            font-weight: 900;
            font-size: 1.3em;
            line-height: 1.2;
            color: inherit;
        }
        .fraction .num {
            border-bottom: 3px solid currentColor;
            padding: 0 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 40px;
        }
        .fraction .den {
            padding: 0 8px;
            margin-top: 2px;
        }

        /* --- کانتینر اصلی --- */
        .app-container {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            width: 100%;
            max-width: 650px;
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15), inset 0 0 0 2px rgba(255,255,255,0.5);
            overflow: hidden;
            position: relative;
            z-index: 10;
        }

        .screen {
            display: none;
            padding: 30px;
            text-align: center;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .screen.active {
            display: block;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- هدر و نوار پیشرفت --- */
        .quiz-header {
            background: #fff;
            padding: 15px 25px;
            border-bottom: 2px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 25px 25px 0 0;
        }

        .quiz-header.hidden {
            display: none;
        }

        .question-counter {
            font-weight: 900;
            color: var(--primary);
            font-size: 1.1rem;
        }

        .score-badge {
            background: #f1f2f6;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            color: #e1b12c;
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background: #eee;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #a29bfe);
            width: 0%;
            transition: width 0.4s ease;
            border-radius: 0 5px 5px 0;
        }

        /* --- استایل صفحه خوش‌آمدگویی --- */
        .hero-title {
            font-size: 2.8rem;
            color: var(--primary);
            margin: 10px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            font-weight: 900;
        }

        .teacher-container {
            background: linear-gradient(45deg, #FDCB6E, #e1b12c);
            color: #fff;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.4rem;
            font-weight: 900;
            display: inline-block;
            margin: 15px 0 25px 0;
            box-shadow: 0 10px 20px rgba(253, 203, 110, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .exciting-msg {
            font-size: 1.2rem;
            color: #2d3436;
            line-height: 1.8;
            margin-bottom: 30px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            border-right: 5px solid var(--primary);
            text-align: center;
        }

        /* --- دکمه‌ها --- */
        .btn {
            background: linear-gradient(135deg, var(--primary), #5a4bcf);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 15px rgba(108, 92, 231, 0.3);
            font-family: inherit;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 20px rgba(108, 92, 231, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-next {
            background: linear-gradient(135deg, var(--success), #009432);
            box-shadow: 0 8px 15px rgba(0, 184, 148, 0.3);
            margin-top: 20px;
            width: 100%;
        }

        /* --- فرم ورود --- */
        input[type="text"].main-input {
            width: 90%;
            padding: 15px;
            font-size: 1.1rem;
            border: 2px solid #dfe6e9;
            border-radius: 15px;
            margin: 20px 0;
            text-align: center;
            transition: all 0.3s;
            font-family: inherit;
            background: rgba(255,255,255,0.8);
        }

        input[type="text"].main-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(108, 92, 231, 0.2);
        }

        /* --- سوالات --- */
        .question-box {
            text-align: right;
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 900;
            margin-bottom: 25px;
            line-height: 2;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            border-right: 6px solid var(--primary);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* استایل برای عبارات ریاضی که باید چپ به راست باشند */
        .math-box {
            direction: ltr;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin: 15px 0;
            padding: 10px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            width: 100%;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-btn {
            background: white;
            color: #2D3436;
            border: 2px solid #dfe6e9;
            padding: 15px 20px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background: #f1f2f6;
            transform: scale(1.02);
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        /* انیمیشن‌های پاسخ */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
            100% { transform: translateX(0); }
        }
        .shake { animation: shake 0.4s ease-in-out; }

        .option-btn.correct {
            background: var(--success) !important;
            color: white !important;
            border-color: var(--success) !important;
        }

        .option-btn.wrong {
            background: var(--danger) !important;
            color: white !important;
            border-color: var(--danger) !important;
        }

        /* --- استایل جای خالی داخل کسر --- */
        .fill-blank-input {
            width: 50px;
            text-align: center;
            font-family: inherit;
            font-size: 1.2rem;
            font-weight: 900;
            border: none;
            background: transparent;
            outline: none;
            color: var(--primary);
        }
        .fill-blank-input::placeholder {
            color: #b2bec3;
        }

        /* --- بازخورد پایانی --- */
        .result-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-top: 20px;
        }

        .result-score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #a29bfe);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            font-size: 2.5rem;
            font-weight: 900;
            box-shadow: 0 10px 20px rgba(108, 92, 231, 0.3);
        }
        
        .result-score-circle span {
            font-size: 1rem;
            font-weight: normal;
            opacity: 0.9;
            margin-top: 5px;
        }

        /* --- افکت بارش ایموجی --- */
        .emoji-particle {
            position: fixed;
            top: -50px;
            z-index: 9999;
            pointer-events: none;
            animation: fall linear forwards;
            text-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- المان های شناور پس زمینه -->
    <div class="bg-shapes" id="bg-shapes"></div>

    <!-- افکت‌های صوتی اختصاصی -->
    <!-- صدای هورا و تشویق برای پاسخ درست -->
    <audio id="sound-correct" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3" preload="auto"></audio>
    <!-- صدای دقت کن (بوق ملایم) برای پاسخ غلط -->
    <audio id="sound-wrong" src="https://assets.mixkit.co/active_storage/sfx/951/951-preview.mp3" preload="auto"></audio>

    <div class="app-container">
        
        <!-- هدر بالای صفحه آزمون -->
        <div class="quiz-header hidden" id="main-header">
            <div class="question-counter" id="q-counter">سوال ۱ از ۱۵</div>
            <div class="score-badge"><i class="fa-solid fa-star"></i> امتیاز: <span id="live-score">0</span></div>
        </div>
        <div class="progress-container hidden" id="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <!-- صفحه ۱: خوش‌آمدگویی -->
        <div id="screen-welcome" class="screen active">
            <div style="font-size: 4.5rem; margin-bottom: 5px;">🧮✨</div>
            <h1 class="hero-title">بازی و ریاضی</h1>
            
            <div class="teacher-container">
                <i class="fa-solid fa-chalkboard-user"></i> آموزگار: مهتاب سعیدی
            </div>

            <div class="exciting-msg">
                سلام قهرمان! 🌟<br>
                آماده‌ای تا با هیجان‌انگیزترین بازی ریاضی سال روبرو بشی؟<br>
                بیا ثابت کن چقدر کسرها رو خوب یاد گرفتی و ستاره‌ها و شکلات‌ها رو جمع کن! 🚀🍫
            </div>

            <button class="btn" onclick="showScreen('screen-name')">شروع ماجراجویی <i class="fa-solid fa-rocket"></i></button>
        </div>

        <!-- صفحه ۲: نام و نام خانوادگی -->
        <div id="screen-name" class="screen">
            <div style="font-size: 4rem; margin-bottom: 15px;">✍️</div>
            <h2 style="color: var(--primary); margin-bottom: 20px;">قهرمان ریاضی، اسمت چیه؟</h2>
            <input type="text" id="student-name" class="main-input" placeholder="نام و نام خانوادگی خود را بنویس..." required autocomplete="off">
            <br>
            <button class="btn" onclick="startQuiz()">بزن بریم! <i class="fa-solid fa-arrow-left"></i></button>
        </div>

        <!-- صفحه ۳: سوالات -->
        <div id="screen-quiz" class="screen">
            <div id="question-content" class="question-box">
                <!-- محتوای سوال اینجا لود می‌شود -->
            </div>
            <button id="next-btn" class="btn btn-next" onclick="nextQuestion()" style="display: none;">
                سوال بعدی <i class="fa-solid fa-arrow-left"></i>
            </button>
        </div>

        <!-- صفحه ۴: بازخورد و نتیجه -->
        <div id="screen-result" class="screen">
            <div style="font-size: 4rem;" id="result-emoji">🏆</div>
            <h2 style="color: var(--primary); margin: 10px 0;" id="result-title">پایان بازی!</h2>
            <p style="font-size: 1.2rem; font-weight: bold; color: #636e72;" id="result-name"></p>
            
            <div class="result-card">
                <div class="result-score-circle" id="result-score-circle">
                    0<span>از ۱۵</span>
                </div>
                <div id="feedback-text" style="font-size: 1.1rem; line-height: 1.8; color: #2d3436; padding: 15px; border-radius: 15px; background: #f8f9fa;">
                    <!-- متن بازخورد -->
                </div>
            </div>
            
            <button class="btn" onclick="location.reload()" style="margin-top: 25px; width: 100%;">
                <i class="fa-solid fa-rotate-right"></i> تکرار و تمرین مجدد
            </button>
        </div>
    </div>

    <script>
        // --- ساخت المان های شناور پس زمینه ---
        function createBackgroundShapes() {
            const bg = document.getElementById('bg-shapes');
            const symbols = ['+', '-', '=', '÷', '×', '1/2', '3/4', '2/3', '1/5', 'π'];
            for (let i = 0; i < 20; i++) {
                let span = document.createElement('span');
                span.classList.add('shape');
                span.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                span.style.left = Math.random() * 100 + 'vw';
                span.style.fontSize = (Math.random() * 40 + 20) + 'px';
                span.style.animationDuration = (Math.random() * 15 + 10) + 's';
                span.style.animationDelay = (Math.random() * 5) + 's';
                bg.appendChild(span);
            }
        }
        createBackgroundShapes();

        // --- تابع ساخت کسر گرافیکی (استاتیک) ---
        function frac(num, den) {
            return `<span class="fraction"><span class="num">${num}</span><span class="den">${den}</span></span>`;
        }

        // --- تابع ساخت کسر با جای خالی (اینپوت) ---
        function fracInput(num, den, id) {
            return `<span class="fraction"><span class="num"><input type="text" id="${id}" class="fill-blank-input" maxlength="3" placeholder="?"></span><span class="den">${den}</span></span>`;
        }

        // --- بانک سوالات (۱۵ سوال) ---
        const questions = [
            {
                type: 'true_false',
                question: 'درستی یا نادرستی عبارت زیر را مشخص کنید:<br>«هر کسر با صورت و مخرج مساوی، برابر ۱ است.»',
                options: ['صحیح', 'غلط'],
                answer: 'صحیح'
            },
            {
                type: 'true_false',
                question: 'درستی یا نادرستی عبارت زیر را مشخص کنید:<br>«برای تفریق دو کسر با مخرج‌های مساوی، مخرج‌ها را از هم کم می‌کنیم.»',
                options: ['صحیح', 'غلط'],
                answer: 'غلط'
            },
            {
                type: 'multiple_choice',
                question: `کدام یک از کسرهای زیر با کسر ${frac(1, 2)} مساوی است؟`,
                options: [frac(2, 4), frac(3, 4), frac(2, 5), frac(1, 3)],
                answer: frac(2, 4)
            },
            {
                type: 'fill_blank',
                question: `جای خالی را کامل کنید تا کسرها مساوی شوند:<div class="math-box">${frac(2, 5)} = ${fracInput('?', '10', 'ans-input-1')}</div>`,
                answer: '4'
            },
            {
                type: 'multiple_choice',
                question: `کدام کسر با کسر ${frac(1, 3)} مساوی است؟`,
                options: [frac(2, 6), frac(2, 4), frac(3, 5), frac(4, 8)],
                answer: frac(2, 6)
            },
            {
                type: 'fill_blank',
                question: `جای خالی را کامل کنید تا تساوی برقرار باشد:<div class="math-box">${frac(3, 4)} = ${fracInput('?', '8', 'ans-input-2')}</div>`,
                answer: '6'
            },
            {
                type: 'multiple_choice',
                question: `حاصل جمع کسرهای زیر کدام است؟<div class="math-box">${frac(2, 7)} + ${frac(3, 7)}</div>`,
                options: [frac(5, 7), frac(5, 14), frac(6, 7), frac(1, 7)],
                answer: frac(5, 7)
            },
            {
                type: 'fill_blank',
                question: `حاصل تفریق کسرهای زیر را بنویسید:<div class="math-box">${frac(5, 9)} - ${frac(2, 9)} = ${fracInput('?', '9', 'ans-input-3')}</div>`,
                answer: '3'
            },
            {
                type: 'multiple_choice',
                question: `کدام یک از تساوی‌های زیر <b>نادرست</b> است؟`,
                options: [`<div dir="ltr">${frac(1, 3)} = ${frac(2, 6)}</div>`, `<div dir="ltr">${frac(4, 5)} = ${frac(8, 10)}</div>`, `<div dir="ltr">${frac(1, 2)} = ${frac(4, 8)}</div>`, `<div dir="ltr">${frac(3, 7)} = ${frac(5, 14)}</div>`],
                answer: `<div dir="ltr">${frac(3, 7)} = ${frac(5, 14)}</div>`
            },
            {
                type: 'multiple_choice',
                question: 'مادری یک کیک را به ۸ قسمت مساوی تقسیم کرد. اگر بچه‌ها ۳ قسمت از آن را بخورند، چه کسری از کیک باقی می‌ماند؟',
                options: [frac(5, 8), frac(3, 8), frac(8, 8), frac(4, 8)],
                answer: frac(5, 8)
            },
            {
                type: 'true_false',
                question: `در کسر ${frac(4, 4)} صورت از مخرج بزرگتر است.`,
                options: ['صحیح', 'غلط'],
                answer: 'غلط'
            },
            {
                type: 'multiple_choice',
                question: 'کدام کسر بزرگتر است؟',
                options: [frac(4, 5), frac(2, 5), frac(3, 5), frac(1, 5)],
                answer: frac(4, 5)
            },
            {
                type: 'fill_blank',
                question: `جای خالی را پر کنید:<div class="math-box">${frac(3, 5)} = ${fracInput('?', '15', 'ans-input-4')}</div>`,
                answer: '9'
            },
            {
                type: 'multiple_choice',
                question: `حاصل عبارت زیر کدام است؟<div class="math-box">${frac(2, 8)} + ${frac(5, 8)}</div>`,
                options: [frac(7, 8), frac(7, 16), frac(3, 8), frac(8, 8)],
                answer: frac(7, 8)
            },
            {
                type: 'multiple_choice',
                question: 'یک شکل به ۱۰ قسمت مساوی تقسیم شده است. اگر ۳ قسمت آن رنگ شود، چه کسری از شکل رنگ شده است؟',
                options: [frac(3, 10), frac(7, 10), frac(10, 3), frac(3, 7)],
                answer: frac(3, 10)
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let studentName = '';

        // مدیریت صفحه‌ها
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function startQuiz() {
            studentName = document.getElementById('student-name').value.trim();
            if (studentName === '') {
                alert('لطفاً برای شروع، نام و نام خانوادگی خود را وارد کنید.');
                return;
            }
            document.getElementById('main-header').classList.remove('hidden');
            document.getElementById('progress-container').classList.remove('hidden');
            showScreen('screen-quiz');
            loadQuestion();
        }

        // --- افکت‌های صوتی و تصویری ---
        function playCorrectEffect() {
            // متوقف کردن هر صدای در حال پخش
            const wrongAudio = document.getElementById('sound-wrong');
            if(wrongAudio) { wrongAudio.pause(); wrongAudio.currentTime = 0; }

            let audio = document.getElementById('sound-correct');
            audio.currentTime = 0;
            audio.volume = 0.7; // تنظیم صدا
            audio.play().catch(e => console.log("Audio blocked by browser"));

            // افکت بارش شکلات و ستاره
            const emojis = ['🍫', '⭐', '🍩', '🎉', '🌟'];
            for (let i = 0; i < 40; i++) {
                setTimeout(() => {
                    const particle = document.createElement('div');
                    particle.classList.add('emoji-particle');
                    particle.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                    particle.style.left = Math.random() * 100 + 'vw';
                    particle.style.fontSize = (Math.random() * 20 + 20) + 'px';
                    particle.style.animationDuration = (Math.random() * 1.5 + 1.5) + 's';
                    document.body.appendChild(particle);
                    setTimeout(() => particle.remove(), 3500);
                }, i * 30);
            }
        }

        function playWrongEffect() {
            // متوقف کردن هر صدای در حال پخش
            const correctAudio = document.getElementById('sound-correct');
            if(correctAudio) { correctAudio.pause(); correctAudio.currentTime = 0; }

            let audio = document.getElementById('sound-wrong');
            audio.currentTime = 0;
            audio.volume = 0.6; // تنظیم صدا
            audio.play().catch(e => console.log("Audio blocked by browser"));
        }

        // --- لود سوالات ---
        function loadQuestion() {
            const q = questions[currentQuestion];
            const content = document.getElementById('question-content');
            const nextBtn = document.getElementById('next-btn');
            
            // آپدیت هدر
            document.getElementById('q-counter').innerText = `سوال ${currentQuestion + 1} از ${questions.length}`;
            document.getElementById('live-score').innerText = score;
            document.getElementById('progress-bar').style.width = `${(currentQuestion / questions.length) * 100}%`;

            let html = `<div class="question-text">${q.question}</div>`;
            
            if (q.type === 'true_false' || q.type === 'multiple_choice') {
                html += `<div class="options" id="options-container">`;
                q.options.forEach((opt, index) => {
                    html += `<button class="option-btn" onclick="selectOption(this, ${index})">${opt}</button>`;
                });
                html += `</div>`;
            } 
            else if (q.type === 'fill_blank') {
                html += `<button class="option-btn" onclick="checkFillBlank()" style="justify-content:center; background:var(--secondary); color:#fff; border:none; margin-top:10px;">ثبت پاسخ <i class="fa-solid fa-check" style="margin-right:10px;"></i></button>`;
            }

            content.innerHTML = html;
            nextBtn.style.display = 'none';
        }

        // --- بررسی پاسخ‌ها ---
        function selectOption(btn, optionIndex) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);
            
            const q = questions[currentQuestion];
            const selectedAnswer = q.options[optionIndex];
            const correctAnswer = q.answer;
            
            if (selectedAnswer === correctAnswer) {
                btn.classList.add('correct');
                score++;
                playCorrectEffect();
            } else {
                btn.classList.add('wrong', 'shake');
                playWrongEffect();
                // پیدا کردن و رنگی کردن گزینه صحیح
                allBtns.forEach((b, index) => {
                    if (q.options[index] === correctAnswer) {
                        b.classList.add('correct');
                    }
                });
            }
            
            document.getElementById('live-score').innerText = score;
            document.getElementById('next-btn').style.display = 'inline-block';
        }

        function checkFillBlank() {
            const input = document.querySelector('.fill-blank-input');
            let val = input.value.trim();
            // تبدیل اعداد فارسی به انگلیسی
            val = val.replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
            
            const correctAnswer = questions[currentQuestion].answer;
            const submitBtn = document.querySelector('.option-btn');
            
            submitBtn.disabled = true;
            input.disabled = true;

            if (val === correctAnswer) {
                score++;
                playCorrectEffect();
                input.style.color = 'var(--success)';
                input.closest('.fraction').style.color = 'var(--success)';
            } else {
                playWrongEffect();
                input.style.color = 'var(--danger)';
                input.closest('.fraction').style.color = 'var(--danger)';
                
                // نمایش پاسخ صحیح
                let span = document.createElement('span');
                span.innerHTML = ` <br><span style="color:var(--success); font-size:1rem; margin-top:10px; display:inline-block;">(پاسخ صحیح: ${correctAnswer})</span>`;
                document.querySelector('.question-text').appendChild(span);
            }
            
            document.getElementById('live-score').innerText = score;
            document.getElementById('next-btn').style.display = 'inline-block';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                finishQuiz();
            }
        }

        // --- پایان بازی ---
        function finishQuiz() {
            document.getElementById('main-header').classList.add('hidden');
            document.getElementById('progress-container').classList.add('hidden');
            showScreen('screen-result');
            
            const percentage = (score / questions.length) * 100;
            document.getElementById('result-name').innerText = `${studentName} عزیز،`;
            document.getElementById('result-score-circle').innerHTML = `${score}<span>از ${questions.length}</span>`;
            
            const feedbackBox = document.getElementById('feedback-text');
            const resultEmoji = document.getElementById('result-emoji');
            const resultTitle = document.getElementById('result-title');

            if (percentage >= 80) {
                resultEmoji.innerText = '🌟🏆🌟';
                resultTitle.innerText = 'عالی بود! نابغه ریاضی!';
                feedbackBox.style.background = '#e8f8f5';
                feedbackBox.style.border = '2px solid var(--success)';
                feedbackBox.innerHTML = `تو در مبحث کسرها فوق‌العاده قوی هستی! دقت و تمرکزت واقعاً تحسین‌برانگیز بود. همیشه همین‌طور با انگیزه پیش برو. بهت افتخار می‌کنم! 🎉`;
                // پخش صدا و افکت برای نمره عالی
                setTimeout(playCorrectEffect, 500); 
            } else if (percentage >= 50) {
                resultEmoji.innerText = '👍📚';
                resultTitle.innerText = 'خیلی خوب بود!';
                feedbackBox.style.background = '#fff9e6';
                feedbackBox.style.border = '2px solid var(--secondary)';
                feedbackBox.innerHTML = `تو مسیر درستی رو طی می‌کنی و درک خوبی از کسرها داری. اما برای اینکه به یک استاد کامل تبدیل بشی، نیاز به کمی تمرین بیشتر داری. ناامید نشو، تکرار و تمرین کلید موفقیت است! 🌱`;
            } else {
                resultEmoji.innerText = '💪✍️';
                resultTitle.innerText = 'نیاز به تمرین بیشتر';
                feedbackBox.style.background = '#ffeaa7';
                feedbackBox.style.border = '2px solid var(--danger)';
                feedbackBox.innerHTML = `اشکالی نداره قهرمان! یادگیری ریاضی مثل یک بازی است که باید چند بار تمرین شود. بیا یک بار دیگه با هم مرور کنیم و سعی کنی دوباره بازی رو انجام بدی. من مطمئنم با تکرار و تمرین، دفعه بعد نتیجه بهتری می‌گیری! 🚀`;
            }
        }
    </script>
</body>
</html>
